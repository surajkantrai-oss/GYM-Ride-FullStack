name: gymride
services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymride}
      POSTGRES_USER: ${POSTGRES_USER:-gymride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymride_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - gymride_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [gymride]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - gymride_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [gymride]

volumes:
  gymride_postgres_data:
  gymride_redis_data:

networks:
  gymride:
    driver: bridge
